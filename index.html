<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle">Dark Mode</button>
    <div class="container">
        <h1>Lotto Number Generator</h1>
        <button id="generate">Generate Numbers</button>
        <div id="numbers-container"></div>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid var(--shadow-color);">

        <section id="partnership">
            <h2>Partnership Inquiry</h2>
            <form action="https://formspree.io/f/maqkvwvq" method="POST">
                <div class="form-group">
                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required placeholder="How can we work together?"></textarea>
                </div>
                <button type="submit" id="submit-btn">Send Inquiry</button>
            </form>
        </section>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid var(--shadow-color);">

        <section id="comments">
            <div id="disqus_thread"></div>
            <script>

                };

                var d = document, s = d.createElement('script');
                s.src = 'https://nyaaaahaha.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());

                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
