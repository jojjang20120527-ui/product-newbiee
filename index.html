<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 생성기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle">다크 모드</button>
    <div class="container">
        <h1>로또 번호 생성기</h1>
        <button id="generate">번호 생성하기</button>
        <div id="numbers-container"></div>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid var(--shadow-color);">

        <section id="partnership">
            <h2>제휴 문의</h2>
            <form action="https://formspree.io/f/maqkvwvq" method="POST">
                <div class="form-group">
                    <label for="email">이메일 주소:</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="message">문의 내용:</label>
                    <textarea id="message" name="message" required placeholder="함께 협업할 수 있는 방안을 적어주세요."></textarea>
                </div>
                <button type="submit" id="submit-btn">문의 보내기</button>
            </form>
        </section>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid var(--shadow-color);">

        <section id="comments">
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */

                var disqus_config = function () {
                this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                */
                (function() { // DON'T EDIT BELOW THIS LINE
                var d = document, s = d.createElement('script');
                s.src = 'https://nyaaaahaha.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Disqus 댓글을 확인하려면 자바스크립트를 활성화해주세요. <a href="https://disqus.com/?ref_noscript">Disqus 제공.</a></noscript>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
